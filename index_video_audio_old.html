<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LessonBoard</title>
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1d1b16;--mu:#6b665a;--ln:#ddd6c6;--ac:#e4572e;--g:#1f6f5c;--ok:#e2f1ea;--bad:#fbe5df;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 Georgia,"Times New Roman",serif}
.mono,code,pre{font-family:ui-monospace,Menlo,Consolas,monospace}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 8px}
.logo{font-weight:700;font-size:22px}.logo b{color:var(--ac)}
.hero{padding:22px 0 8px}
.cells{display:flex;gap:6px;margin-bottom:14px}
.cells span{width:44px;height:44px;border:2px solid var(--ink);display:grid;place-items:center;font:600 16px ui-monospace,Menlo,monospace;background:var(--card)}
.cells span:nth-child(2){background:var(--ac);color:#fff;border-color:var(--ac)}
.cells span:nth-child(4){background:var(--g);color:#fff;border-color:var(--g)}
h1{font-size:clamp(34px,7vw,54px);line-height:1.08;margin:0 0 6px;letter-spacing:-.02em}
.mu{color:var(--mu);font-size:15px}
nav{display:flex;gap:0;margin:18px 0 20px;border-bottom:2px solid var(--ink);overflow-x:auto}
nav button{flex:1;font:600 17px Georgia,serif;padding:12px 18px;border:0;background:none;color:var(--mu);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--ac)}
h2{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin:26px 0 10px;font-family:ui-monospace,Menlo,monospace}
.card{background:var(--card);border:1.5px solid var(--ln);border-radius:12px;padding:14px 16px;margin:10px 0}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.t{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--ln)}
.t input{width:24px;height:24px;accent-color:var(--g);flex:none}
.t span{flex:1}.t.d span{text-decoration:line-through;color:var(--mu)}
.x{border:0;background:none;color:var(--mu);font-size:22px;cursor:pointer;padding:4px 10px;border-radius:8px}.x:hover{background:var(--bad);color:var(--ac)}
.add{display:flex;gap:8px;margin-top:14px}
label{display:block;font-weight:700;margin:0 0 4px;font-size:16px}
textarea{width:100%;min-height:80px;font:inherit;font-size:17px;padding:11px 13px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink)}textarea:focus{outline:2px solid var(--ac)}
input[type=text]{width:100%;flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 13px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--ac)}
.btn{font:600 16px Georgia,serif;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
.btn.a{background:var(--ac);color:#fff}
details{background:var(--card);border:1.5px solid var(--ln);border-radius:12px;margin:10px 0;padding:0 16px}
summary{cursor:pointer;font-weight:700;padding:14px 0;font-size:19px}
details[open] summary{color:var(--ac)}
details p{margin:0 0 12px}
pre{background:#1d1b16;color:#f2eee2;padding:12px 14px;border-radius:10px;overflow-x:auto;font-size:15px;line-height:1.5;margin:0 0 14px}
.tag{display:inline-block;font:600 13px ui-monospace,Menlo,monospace;background:var(--ok);color:var(--g);padding:2px 9px;border-radius:99px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:17px;padding:11px 14px;margin:6px 0;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:10px;cursor:pointer}
.opt.sel{border-color:var(--ac);box-shadow:0 0 0 3px rgba(228,87,46,.2)}
.opt.r{background:var(--ok);border-color:var(--g)}.opt.w{background:var(--bad);border-color:var(--ac)}
.score{font:700 38px ui-monospace,Menlo,monospace;color:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 16px Georgia,serif;padding:9px 16px;border:1.5px solid var(--ln);border-radius:99px;background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--ac);margin-top:8px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.note{padding:12px;border-radius:4px 4px 16px 4px;box-shadow:0 4px 10px rgba(0,0,0,.14)}
.note label,.note textarea{color:#2a2616}.note label{font-size:14px}
.note textarea{background:rgba(255,255,255,.55);border:0;min-height:120px}
.ticket{border:2px dashed var(--ac);border-radius:14px;padding:14px 16px;background:var(--card)}
.hid{display:none}
.emo{display:flex;gap:8px;justify-content:center}
.eb{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:2px solid var(--ln);border-radius:16px;padding:10px 2px;flex:1 1 0;min-width:0;cursor:pointer;color:var(--ink);font:inherit;text-align:center}
.eb .e{font-size:clamp(30px,9vw,44px);line-height:1;display:block;transition:transform .2s}.eb small{font-size:clamp(10px,2.7vw,13px);color:var(--mu);overflow-wrap:anywhere}
.eb:hover .e{transform:scale(1.25) rotate(-6deg)}.eb.on{border-color:var(--ac);background:var(--ok);box-shadow:0 0 0 3px rgba(228,87,46,.2)}
.eb.on .e{animation:pop .6s ease,wob 2.2s ease-in-out .6s infinite}
.big{font-size:84px;line-height:1.1;margin:4px 0;animation:bob 2.4s ease-in-out infinite}.big.pop{animation:pop .6s ease,bob 2.4s ease-in-out .6s infinite}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.3);opacity:1}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.deck{background:var(--card);border:1.5px solid var(--ln);border-radius:12px;padding:8px;margin:10px 0 16px}.deck img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#fff;border-radius:8px;display:block;transition:opacity .15s}.deck img.ld{opacity:.4}.dkbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}.deck:fullscreen{background:#111;display:flex;flex-direction:column;justify-content:center;padding:12px}.deck:fullscreen img{max-height:calc(100vh - 110px)}
@media print{body *{visibility:hidden}#poster,#poster *{visibility:visible}#poster{position:fixed;left:0;top:0;width:100%;border:0;background:#fff;color:#000}}
audio{width:100%}video{width:100%;border-radius:10px;display:block}iframe.yt{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}
.dz{display:block;margin-top:10px;border:2px dashed var(--ln);border-radius:12px;padding:18px;text-align:center;color:var(--mu);cursor:pointer;font-size:16px}.dz.hov{border-color:var(--ac);background:var(--ok)}.th{height:56px;width:auto;display:inline-block;margin:8px 6px 0 0;border-radius:6px}
figure{margin:10px 0}img{max-width:100%;border-radius:10px;display:block}figcaption{font-size:14px;margin-top:4px}details a,.card a{color:var(--ac)}
.sp{filter:blur(7px);cursor:pointer;user-select:none;transition:filter .2s}.sp.on{filter:none;user-select:auto}
</style></head><body><div class="wrap">

const DEF={"v": 0, "topic": "Вставка видео и аудио в документ HTML", "goals": ["Научиться вставлять звук и видео в шаблон web-страницы с помощью тегов audio и video", "Выполнить задания по технике безопасности и проверить знание тегов в LearningApps", "Создать сайт композитора со своими материалами и улучшить его с помощью искусственного интеллекта"], "lec": [{"t": "Зачем нужны audio и video", "b": "Раньше для звука и видео на сайте требовались сторонние плагины. В HTML5 появились теги **audio** и **video**: браузер сам воспроизводит файл и показывает плеер.\n\nОба тега пишутся внутри **body**. Файл с мелодией или роликом должен лежать рядом с HTML-страницей или в её папке."}, {"t": "Тег audio", "b": "Минимальный пример: звук с кнопками управления.\n\n```\n<audio controls src=\"song.mp3\">\n  Ваш браузер не поддерживает аудио.\n</audio>\n```\n\nОсновные атрибуты: **controls** показывает кнопки плеера, **autoplay** запускает звук сразу (браузеры часто блокируют это), **loop** зацикливает, **muted** выключает звук."}, {"t": "Тег video", "b": "Для видео добавляют размеры и обложку.\n\n```\n<video controls width=\"640\" poster=\"cover.jpg\">\n  <source src=\"clip.mp4\" type=\"video/mp4\">\n  <source src=\"clip.webm\" type=\"video/webm\">\n  Ваш браузер не поддерживает видео.\n</video>\n```\n\nАтрибут **width** задаёт ширину, **poster** показывает картинку до запуска. Атрибуты controls, autoplay, loop и muted работают так же, как у audio."}, {"t": "Форматы и тег source", "b": "Аудио: **MP3**, OGG, WAV. Видео: **MP4**, WebM, Ogg. Самые универсальные: MP3 и MP4.\n\nТег **source** позволяет предложить несколько файлов, а браузер выберет первый, который сможет воспроизвести. Атрибут **type** указывает формат. Текст внутри тега audio или video виден только в старых браузерах."}, {"t": "Пути к файлам и видео с YouTube", "b": "Если файл лежит в папке music, путь пишется так: **src=\"music/song.mp3\"**. Скелет страницы: html, внутри head и body.\n\nЧужое видео с YouTube вставляют тегом **iframe**.\n\n```\n<iframe src=\"https://www.youtube.com/embed/ИДЕНТИФИКАТОР\" allowfullscreen></iframe>\n```\n\nВ заданиях урока вы соберёте сайт композитора из файлов index, header, menu, main и footer и добавите на страницу его музыку."}], "quiz": [{"q": "Какой тег вставляет звук на веб-страницу?", "o": ["<sound>", "<audio>", "<music>", "<mp3>"], "a": 1}, {"q": "Какой тег вставляет видео?", "o": ["<movie>", "<media>", "<video>", "<film>"], "a": 2}, {"q": "Какой атрибут показывает кнопки управления плеером?", "o": ["play", "controls", "buttons", "panel"], "a": 1}, {"q": "Какой атрибут зацикливает воспроизведение?", "o": ["repeat", "again", "loop", "cycle"], "a": 2}, {"q": "Какой атрибут выключает звук у видео?", "o": ["mute", "silent", "muted", "nosound"], "a": 2}, {"q": "Для чего у video нужен атрибут poster?", "o": ["Задаёт картинку-обложку до запуска", "Задаёт громкость", "Включает субтитры", "Задаёт формат файла"], "a": 0}, {"q": "Зачем нужен тег source?", "o": ["Подписывает видео", "Предлагает браузеру несколько файлов разных форматов", "Добавляет ссылку на сайт", "Задаёт размер окна"], "a": 1}, {"q": "Какой из вариантов является аудиоформатом?", "o": [".html", ".css", ".docx", ".mp3"], "a": 3}, {"q": "Какой видеоформат поддерживается почти всеми браузерами?", "o": ["PSD", "EXE", "MP4", "ZIP"], "a": 2}, {"q": "Что увидит пользователь, если браузер не поддерживает тег audio?", "o": ["Ничего не покажется", "Текст, написанный между тегами", "Пустое окно браузера", "Ошибку сервера"], "a": 1}, {"q": "Чем вставляют на страницу ролик с YouTube?", "o": ["Тегом table", "Тегом br", "Тегом iframe с адресом embed", "Тегом hr"], "a": 2}, {"q": "Как записать путь к song.mp3 из папки music рядом с HTML-файлом?", "o": ["song.mp3/music", "music/song.mp3", "music-song.mp3", "/song.mp3/music/"], "a": 1}, {"q": "Что делает атрибут autoplay?", "o": ["Ставит на паузу", "Скрывает плеер", "Запускает воспроизведение автоматически", "Увеличивает громкость"], "a": 2}, {"q": "В какой части документа размещают тег video?", "o": ["В head", "В body", "В title", "Перед DOCTYPE"], "a": 1}, {"q": "Какой порядок тегов верен для скелета HTML-документа?", "o": ["body, head, html", "head, html, body", "html, body, head", "html, head, body"], "a": 3}], "tasks": [{"t": "Вопросы по технике безопасности (3 балла)", "b": "Откройте игру-рандомайзер по технике безопасности: [Открыть игру по ТБ](Game5.html). Нажмите «Запустить рандомайзер», ответьте на выпавший вопрос и сверьтесь с ответом.\n\nЗа каждый правильный ответ на вопрос вы получаете **3 балла**.\n\n**Критерии (максимум 3 баллов):** правильно отвечает на вопрос по правилам безопасной работы за компьютером."}, {"t": "Интерактивные задания LearningApps (27 баллов)", "b": "Откройте сервис [LearningApps](https://learningapps.org/watch?v=pm6bj3btc26). Проанализировав новый материал, выполните три задания подряд.\n\n**Задание 1: соотнесение тегов и описаний (8 баллов).** Перетащите карточку с тегом на подходящую карточку с описанием. Если ответ верный, карточки «прилипают» друг к другу и подсвечиваются зелёным.\n\n**Критерии:** по 1 баллу за каждую из 8 пар.\n\n**Задание 2: распределение тегов (10 баллов).** Перетащите каждый тег в нужную колонку. В конце нажмите кнопку проверки (галочку в углу), чтобы увидеть ошибочно распределённые теги.\n\n**Критерии:** по 1 баллу за каждый из 10 тегов.\n\n**Задание 3: порядок элементов HTML (9 баллов).** Расставьте карточки сверху вниз в строгом порядке, восстановив правильный скелет HTML-документа.\n\n**Критерии:** по 1 баллу за каждый из 9 элементов на своём месте."}, {"t": "Практическое задание 1: сайт о композиторе (25 баллов)", "b": "Создайте новый сайт и назовите его «Имя композитора (Фамилия студента)». Выберите шаблон и подберите свои изображения и материалы о композиторе. Композитора берите из списка доступных: один студент, один композитор.\n\n**Шаг 1.** Создайте несколько файлов: index, footer, header, main, menu. Начните с index: добавьте фреймы (frame), задайте им размеры и расположение на странице.\n\n**Шаг 2.** В файле footer сделайте «подвал» сайта, в файле header сделайте шапку.\n\n**Шаг 3.** В файле menu.html создайте гиперссылки на другие части сайта.\n\n**Шаг 4.** В файле main опишите путь и жизнь композитора, добавьте портрет и аудиофайлы с его произведениями (тег audio).\n\n**Критерии (максимум 25 баллов):** создан сайт с именем выбранного композитора (3); подготовлены файлы index, header, footer, menu, main (5); настроены фреймы и навигация (7); размещены сведения, изображения и аудио (10)."}, {"t": "Практическое задание 2: генерация сайта с ИИ (25 баллов)", "b": "Создайте новый вариант сайта с помощью искусственного интеллекта.\n\nПлатформы: промт [Gemini](https://gemini.google.com), генерация сайта [Claude](https://claude.ai/), текст [ChatGPT](https://chatgpt.com/).\n\n**Шаг 1.** Загрузите свой файл main.html в строку промта и напишите запрос, например:\n\n```\nСоздай мне сайт на основе информации из этого файла\n```\n\nДождитесь генерации и скачайте готовый сайт кнопкой экспорта в правом верхнем углу.\n\n**Шаг 2.** Откройте скачанный файл и найдите недочёты. Если они есть, в том же чате попросите ИИ переделать как нужно. Проверьте, что результат соответствует материалу о композиторе.\n\n**Критерии (максимум 25 баллов):** подготовлен содержательный запрос на основе main.html (5); получен и сохранён сайт (8); проверены и исправлены недочёты (8); результат соответствует материалу о композиторе (4)."}, {"t": "Практическое задание 3: доработка сайта с CSS и JavaScript (20 баллов)", "b": "Доработайте сайт, полученный с помощью ИИ, используя CSS и JavaScript. В том же чате напишите запрос, например:\n\n```\nДобавь анимации, сделай стили, используй CSS и JavaScript\n```\n\nДобавьте на страницу стили и работающий элемент JavaScript. Затем проверьте, как сайт выглядит, работает ли навигация и воспроизводятся ли аудио и видео.\n\n**Критерии (максимум 20 баллов):** добавлены стили CSS (7); реализован работающий элемент JavaScript (7); проверены отображение, навигация и работа медиафайлов (6)."}, {"t": "Видеоурок и дополнительные материалы (без баллов)", "b": "**Инструкционная карта.**\n\n[Открыть инструкционную карту](instrukcionnaya-karta.pdf)\n\n[Видеоурок на YouTube](https://www.youtube.com/watch?v=ae_7JsgWLLY)\n\n[Google-презентация как интерактивная доска](https://docs.google.com/presentation/d/1PUSGjzmsGZp4sRYA6vKk0I22s08PjVrxCuAm3AVoEl4/edit?usp=sharing)\n\n[Таблица самооценивания студента](https://docs.google.com/spreadsheets/d/1uk6l2yOgzATDRbqhbMQtAobp07WDZmCamsFQVv8jQaM/edit?gid=1469562070#gid=1469562070)\n\nБесплатные платформы ИИ: изображения [Gemini](https://gemini.google.com), презентации [Gamma](https://gamma.app), текст [ChatGPT](https://chatgpt.com/)."}], "self": [{"t": "Вопросы по технике безопасности", "m": 3}, {"t": "Интерактивное задание 1: соотнесение тегов и описаний", "m": 8}, {"t": "Интерактивное задание 2: распределение тегов", "m": 10}, {"t": "Интерактивное задание 3: порядок элементов HTML", "m": 9}, {"t": "Практическое задание 1: сайт о композиторе", "m": 25}, {"t": "Практическое задание 2: генерация сайта с ИИ", "m": 25}, {"t": "Практическое задание 3: доработка сайта с CSS и JavaScript", "m": 20}], "m": 3, "tm": 5};
let C,GOALS,LEC,QZ,D=null,EM="",JD="",JDsel="",JSEL="";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

const GIF="data:image/gif;base64,R0lGODlhAQABAAAAACw=";
async function getImg(id){if(IMG[id])return IMG[id];if(IMGP[id])return IMGP[id];IMGP[id]=(async()=>{try{const r=await fetch(API+"?action=image&id="+id),d=await r.json();if(d.data&&/^data:image\//.test(d.data)){IMG[id]=d.data;return d.data}}catch(e){}return null})();const v=await IMGP[id];delete IMGP[id];return v}
async function dkShow(){const S=C.slides||[],id=S[DK],im=$("#dkimg");if(!im||!id)return;const n=$("#dkn"),b=$("#dkb");if(n)n.textContent=(DK+1)+" / "+S.length;if(b)b.style.width=((DK+1)/S.length*100)+"%";im.classList.add("ld");const d=await getImg(id);if(S[DK]===id){if(d)im.src=d;im.classList.remove("ld")}for(const j of [DK+1,DK+2])if(S[j])getImg(S[j])}
function deckGo(d){const S=C.slides||[];if(!S.length)return;const n=Math.max(0,Math.min(S.length-1,DK+d));if(n===DK)return;DK=n;dkShow()}
function deckV(){const S=C.slides||[];if(!S.length)return"";DK=Math.min(DK,S.length-1);return `<h2>Презентация</h2><div id="deck" class="deck"><img id="dkimg" src="${IMG[S[DK]]||GIF}" alt="Слайд презентации"><div class="bar" style="margin:8px 0 0"><i id="dkb" style="width:${(DK+1)/S.length*100}%"></i></div><div class="dkbar"><button class="btn" data-a="dk" data-d="-1" aria-label="Назад">←</button><span class="mono" id="dkn">${DK+1} / ${S.length}</span><button class="btn" data-a="dk" data-d="1" aria-label="Вперёд">→</button><button class="btn" data-a="dkf" aria-label="На весь экран">⛶</button></div></div>`}
async function loadPdfJs(){if(window.pdfjsLib)return;await new Promise((ok,no)=>{const e=document.createElement("script");e.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";e.onload=ok;e.onerror=no;document.head.appendChild(e)});pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}
async function slideUp(data,pin){const id="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);post({action:"saveImage",pin,id,data});IMG[id]=data;await new Promise(r=>setTimeout(r,900));return id}
async function addSlides(files){files=[...files];const pin=TP||prompt("PIN преподавателя");if(!pin)return;
const pdf=files.find(f=>/\.pdf$/i.test(f.name)||f.type==="application/pdf"),imgs=files.filter(f=>f.type.startsWith("image/"));
if(!pdf&&!imgs.length){EM=files.some(f=>/\.pptx?$/i.test(f.name))?"PPTX на сайте открыть нельзя. В PowerPoint выберите Файл → Экспорт → PDF и перетащите PDF сюда.":"Нужен PDF презентации или картинки слайдов";render();return}
const ids=[];
try{
if(pdf){EM="Читаю презентацию…";render();await loadPdfJs();const doc=await pdfjsLib.getDocument({data:await pdf.arrayBuffer()}).promise;
for(let n=1;n<=doc.numPages;n++){EM="Загружаю слайд "+n+" из "+doc.numPages+"…";render();const pg=await doc.getPage(n),v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:1000/v0.width}),c=document.createElement("canvas");c.width=Math.round(v.width);c.height=Math.round(v.height);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:v}).promise;let data=c.toDataURL("image/jpeg",0.72);if(data.length>380000)data=c.toDataURL("image/jpeg",0.5);ids.push(await slideUp(data,pin))}}
else{imgs.sort((a,b)=>a.name.localeCompare(b.name,"ru",{numeric:true}));for(let n=0;n<imgs.length;n++){EM="Загружаю слайд "+(n+1)+" из "+imgs.length+"…";render();let data=await shrink(imgs[n],1000,0.72);if(data.length>380000)data=await shrink(imgs[n],800,0.5);ids.push(await slideUp(data,pin))}}
await new Promise(r=>setTimeout(r,2500));let ok=true;for(const id of [ids[0],ids[ids.length-1]]){try{const r=await fetch(API+"?action=image&id="+id),d=await r.json();if(!d.data)ok=false}catch(e){ok=false}}
if(!ok){EM="Слайды не сохранились: проверьте PIN и адрес скрипта";render();return}
TP=pin;save("lb_pin",pin);D.slides=ids;DK=0;EM="Презентация загружена: слайдов "+ids.length+" ✓ Нажмите «Сохранить для студентов»"}
catch(e){EM="Не удалось обработать файл"}render()}
document.addEventListener("keydown",e=>{if(tab!=="lecture"||!(C.slides||[]).length)return;const t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;if(e.key==="ArrowRight"||e.key==="PageDown"){deckGo(1);e.preventDefault()}else if(e.key==="ArrowLeft"||e.key==="PageUp"){deckGo(-1);e.preventDefault()}});
let TX=0;document.addEventListener("touchstart",e=>{if(e.target.closest&&e.target.closest("#deck"))TX=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{if(!(e.target.closest&&e.target.closest("#deck")))return;const dx=e.changedTouches[0].clientX-TX;if(Math.abs(dx)>50)deckGo(dx<0?1:-1)},{passive:true});
function lecV(){return deckV()||`<p class="mu">Презентация пока не загружена.</p>`}
function taskV(){return `<p class="mu">Выполняйте задания по порядку. Баллы указаны в названиях.</p>`+(C.tasks||[]).map((x,i)=>`<details ${i==0?"open":""}><summary>${i+1}. ${esc(x.t)}</summary>${fmt(x.b)}</details>`).join("")}
function editV(){if(!D)D=JSON.parse(JSON.stringify(C));if(D.att==null)D.att=20;if(!D.pts)D.pts={...P()};D.pts={...D.pts};if(D.pts.notes){D.pts.self=(+D.pts.self||0)+D.pts.notes;D.pts.notes=0}if(!D.tasks)D.tasks=JSON.parse(JSON.stringify(DEF.tasks));if(!D.self)D.self=JSON.parse(JSON.stringify(DEF.self));
return `<div class="card"><b>Редактор урока</b><p class="mu">Измените текст и нажмите «Сохранить для студентов». Изменения появятся у студентов при следующем открытии страницы, их старые ответы теста и рефлексии сбросятся.</p></div>
<label>Тема</label><input type="text" data-e="topic" value="${esc(D.topic)}">
